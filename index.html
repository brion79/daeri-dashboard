<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
body{margin:0;background:#0f1115;color:#e6e6e6;font-family:system-ui,sans-serif;font-size:15px}
header{padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:#161a22;position:sticky;top:0;z-index:2}h1{font-size:18px;margin:0}
main{padding:10px;max-width:760px;margin:auto}section{background:#171b24;border-radius:12px;padding:12px;margin:10px 0}
h2{font-size:16px;margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#202634;border-radius:10px;padding:10px}.card b{font-size:22px;display:block}.card small{color:#9aa}
.bar{height:8px;background:#333;border-radius:4px;margin-top:6px}.bar i{display:block;height:100%;background:#3ddc84;border-radius:4px}
input,select,button{background:#0f1115;color:#eee;border:1px solid #333;border-radius:8px;padding:8px;font-size:15px;width:100%;box-sizing:border-box}
button{background:#2b6cff;border:0;font-weight:600}button.s{background:#333;width:auto;padding:4px 8px}
label{font-size:12px;color:#9aa}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #2a2f3a;padding:4px}
.big{font-size:30px;font-weight:700}.ok{color:#3ddc84}.hold{color:#ffc107}.no{color:#ff5c5c}
</style></head><body>
<header><h1>🚗 대리 모니터 <small id="today" style="color:#9aa;font-size:13px"></small></h1></header><main>
<section><h2>오늘 진행</h2><div class="grid">
<div class="card"><small>콜 수</small><b id="cCalls"></b><div class="bar"><i id="pCalls"></i></div></div>
<div class="card"><small>수익(순)</small><b id="cEarn"></b><div class="bar"><i id="pEarn"></i></div></div>
<div class="card"><small>현재 평균/콜</small><b id="cAvg"></b></div>
<div class="card"><small>남은 콜 필요 평균</small><b id="cReq"></b></div>
<div class="card" style="grid-column:span 2"><small>시급 (첫 콜 시작부터)</small><b id="cHour"></b></div></div></section>
<section><h2>⏰ 시간대 전략</h2><div id="strat"></div></section>
<section><h2>🎯 콜 점수</h2><div class="grid">
<div><label>수익(원)</label><input id="sFare" type="number" value="25000"></div>
<div><label>출발지까지 km</label><input id="sKm" type="number" step="0.1" value="1"></div>
<div><label>운행분</label><input id="sMin" type="number" value="30"></div>
<div><label>이동속도 km/h</label><input id="sSpd" type="number" step="0.1" value="4.8"></div>
<div><label>결제</label><select id="sPay"><option>카드</option><option>확정</option><option>법인</option><option>현금</option></select></div>
<div><label><input id="sHot" type="checkbox" style="width:auto"> 도착지 핫존</label></div></div>
<div style="margin-top:8px"><span class="big" id="sScore"></span> <span class="big" id="sVerdict"></span><div id="sDetail" style="font-size:12px;color:#9aa"></div></div></section>
<section><h2>➕ 콜 기록</h2><form id="f" class="grid">
<div><label>시간</label><input id="fTime" type="time" required></div>
<div><label>앱</label><select id="fApp"><option>카카오T</option><option>TMAP</option></select></div>
<div><label>출발지</label><input id="fFrom"></div><div><label>도착지</label><input id="fTo"></div>
<div><label>운행분</label><input id="fMin" type="number"></div><div><label>수익</label><input id="fFare" type="number" required></div>
<div><label>결제</label><select id="fPay"><option>카드</option><option>확정</option><option>법인</option><option>현금</option></select></div>
<div><label>이동/교통비</label><input id="fExp" type="number" value="0"></div>
<button style="grid-column:span 2" id="fBtn">추가</button></form>
<div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>시간</th><th>앱</th><th>경로</th><th>분</th><th>수익</th><th>결제</th><th>비용</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></section>
<section><h2>📊 주간 기록</h2><canvas id="ch" height="200"></canvas><div id="stats" style="margin-top:8px"></div>
<div class="grid" style="margin-top:8px"><button id="exp">CSV 내보내기</button><label style="display:block"><input type="file" id="imp" accept=".csv" style="display:none"><span style="display:block;text-align:center;background:#333;padding:9px;border-radius:8px;color:#eee">CSV 가져오기</span></label></div></section>
</main><script>
const GOAL_C=7,GOAL_W=150000,KEY='daeri_v1';
const $=id=>document.getElementById(id),won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
let db=JSON.parse(localStorage.getItem(KEY)||'{}'),editIdx=-1,chart;
const dkey=(d=new Date())=>{const t=new Date(d);if(t.getHours()<6)t.setDate(t.getDate()-1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const todayList=()=>db[dkey()]||(db[dkey()]=[]);
const net=c=>(+c.fare||0)-(+c.exp||0);
function stats(){const L=todayList(),n=L.length,sum=L.reduce((a,c)=>a+net(c),0),rem=Math.max(GOAL_C-n,1);
return{n,sum,avg:n?sum/n:0,req:Math.max(GOAL_W-sum,0)/rem,L}}
function render(){const s=stats();$('today').textContent=dkey()+' (06시 기준 영업일)';
$('cCalls').textContent=s.n+' / '+GOAL_C;$('pCalls').style.width=Math.min(100,s.n/GOAL_C*100)+'%';
$('cEarn').textContent=won(s.sum);$('pEarn').style.width=Math.min(100,s.sum/GOAL_W*100)+'%';
$('cAvg').textContent=won(s.avg);$('cReq').textContent=s.sum>=GOAL_W?'달성!':won(s.req);
let h='-';if(s.n){const times=s.L.map(c=>{let[a,b]=c.time.split(':').map(Number);if(a<6)a+=24;return a*60+b});const now=new Date();let m=now.getHours()*60+now.getMinutes();if(now.getHours()<6)m+=1440;const el=Math.max(m-Math.min(...times),1);h=won(s.sum/(el/60))+'/h ('+(el/60).toFixed(1)+'h)'}$('cHour').textContent=h;
$('tb').innerHTML=s.L.map((c,i)=>`<tr><td>${c.time}</td><td>${c.app}</td><td>${esc(c.from)}→${esc(c.to)}</td><td>${c.min||''}</td><td>${(+c.fare).toLocaleString()}</td><td>${c.pay}</td><td>${c.exp||0}</td><td><button class="s" onclick="ed(${i})">✏️</button><button class="s" onclick="del(${i})">🗑</button></td></tr>`).join('');
score();strat();week()}
const esc=t=>String(t||'').replace(/[<>&"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
window.ed=i=>{const c=todayList()[i];editIdx=i;['Time','App','From','To','Min','Fare','Pay','Exp'].forEach(k=>$('f'+k).value=c[k.toLowerCase()]??'');$('fBtn').textContent='수정 저장'};
window.del=i=>{if(confirm('삭제할까요?')){todayList().splice(i,1);save();render()}};
$('f').onsubmit=e=>{e.preventDefault();const c={};['Time','App','From','To','Min','Fare','Pay','Exp'].forEach(k=>c[k.toLowerCase()]=$('f'+k).value);
const L=todayList();if(editIdx>=0)L[editIdx]=c;else L.push(c);L.sort((a,b)=>{const f=t=>{let[x,y]=t.split(':').map(Number);return(x<6?x+24:x)*60+y};return f(a.time)-f(b.time)});
editIdx=-1;$('fBtn').textContent='추가';$('f').reset();$('fExp').value=0;setNow();save();render()};
function setNow(){const d=new Date();$('fTime').value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function score(){const s=stats(),fare=+$('sFare').value||0,km=+$('sKm').value||0,min=+$('sMin').value||0,spd=+$('sSpd').value||4.8;
const ref=s.sum>=GOAL_W?20000:Math.max(s.req,1);const p1=Math.min(35,35*fare/ref);
const tMin=min+km/spd*60,rate=tMin?fare/(tMin/60):0,p2=Math.min(20,20*rate/30000);
let p3=km<=1.5?15:km<=5?15*(1-(km-1.5)/3.5*0.6):Math.max(0,6-(km-5)*3);
const p4=$('sHot').checked?20:8;const p5={'카드':10,'확정':10,'법인':7,'현금':5}[$('sPay').value];
const t=Math.round(p1+p2+p3+p4+p5);$('sScore').textContent=t+'/100';
const v=t>=70?['수락','ok']:t>=50?['보류','hold']:['거절','no'];$('sVerdict').textContent=v[0];$('sVerdict').className='big '+v[1];
$('sDetail').textContent=`가격 ${p1.toFixed(0)}/35 (기준 ${won(ref)}) · 시급 ${p2.toFixed(0)}/20 (${won(rate)}/h, 총 ${tMin.toFixed(0)}분) · 접근 ${p3.toFixed(0)}/15 · 도착지 ${p4}/20 · 결제 ${p5}/10`}
['sFare','sKm','sMin','sSpd','sPay','sHot'].forEach(id=>$(id).oninput=score);
function strat(){const d=new Date(),m=d.getHours()*60+d.getMinutes();let t;
if(m>=1170&&m<1260)t='🔥 <b>19:30–21:00 골든타임</b><br>노량진→강남/역삼·여의도로 이동해 시작. 분당·수원·일산 등 <b>장거리 외곽행</b> 우선 수락.';
else if(m>=1260)t='🌆 <b>21:00–24:00 복귀콜</b><br>외곽(분당 서현, 수원 인계동, 일산 등)에서 <b>서울 복귀콜</b> 노리기. 귀가 동선(노량진 방향) 고려.';
else if(m<120)t='🌙 <b>00:00–02:00 할증 시간</b><br>할증 붙는 <b>장거리콜</b> 적극 수락. 첫차·심야버스 귀가 경로 확인.';
else t='😴 <b>휴식 시간</b><br>무리하지 말고 휴식·정비. 19:30 골든타임 전 여의도/강남 이동 준비 (노량진에서 9호선/1호선).';
$('strat').innerHTML=t+`<div style="color:#9aa;font-size:12px;margin-top:4px">현재 ${d.toTimeString().slice(0,5)}</div>`}
function week(){const labels=[],earn=[],calls=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(12);d.setDate(d.getDate()-i);const k=dkey(d),L=db[k]||[];labels.push(k.slice(5));earn.push(L.reduce((a,c)=>a+net(c),0));calls.push(L.length)}
const days=Object.keys(db).filter(k=>db[k].length),hit=days.filter(k=>db[k].length>=GOAL_C&&db[k].reduce((a,c)=>a+net(c),0)>=GOAL_W).length;
$('stats').innerHTML=`주간 합계 ${won(earn.reduce((a,b)=>a+b,0))} · ${calls.reduce((a,b)=>a+b,0)}콜<br>전체 ${days.length}일 중 목표달성 ${hit}일`;
if(typeof Chart==='undefined')return;const data={labels,datasets:[{type:'bar',label:'수익',data:earn,backgroundColor:earn.map(v=>v>=GOAL_W?'#3ddc84':'#2b6cff'),yAxisID:'y'},{type:'line',label:'콜',data:calls,borderColor:'#ffc107',yAxisID:'y1'}]};
if(chart){chart.data=data;chart.update();return}
chart=new Chart($('ch'),{data,options:{plugins:{legend:{labels:{color:'#ccc'}}},scales:{x:{ticks:{color:'#aaa'}},y:{ticks:{color:'#aaa'}},y1:{position:'right',ticks:{color:'#aaa'},grid:{display:false}}}}})}
$('exp').onclick=()=>{const rows=['date,time,app,from,to,min,fare,pay,exp'];Object.keys(db).sort().forEach(k=>db[k].forEach(c=>rows.push([k,c.time,c.app,c.from,c.to,c.min,c.fare,c.pay,c.exp].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='daeri.csv';a.click()};
function parseLine(l){const o=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch=='"'&&l[i+1]=='"'){cur+='"';i++}else if(ch=='"')q=false;else cur+=ch}else if(ch=='"')q=true;else if(ch==','){o.push(cur);cur=''}else cur+=ch}o.push(cur);return o}
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{let n=0;t.replace(/^\ufeff/,'').split(/\r?\n/).slice(1).filter(Boolean).forEach(l=>{const[d,time,app,from,to,min,fare,pay,exp]=parseLine(l);(db[d]=db[d]||[]).push({time,app,from,to,min,fare,pay,exp});n++});save();render();alert(n+'건 가져옴')})};
setNow();render();setInterval(render,60000);
</script></body></html>
